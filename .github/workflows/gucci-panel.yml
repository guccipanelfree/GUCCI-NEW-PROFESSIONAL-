name: Settings APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH="$PWD/gradle-8.2/bin:$PATH"

          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/example/shtile
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Settings"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.shtile'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.shtile"
                  minSdk 24
                  targetSdk 34
                  versionCode 31
                  versionName "31.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>

              <application
                  android:allowBackup="true"
                  android:label="Settings"
                  android:theme="@style/Theme.MaterialComponents.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RunnerService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>

                  <service
                      android:name=".SafeTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_normal"
                      android:label="Boost"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>

                  <service
                      android:name=".BrutalTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_brutal"
                      android:label="Turbo Mode"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/shtile/RunnerService.kt <<'EOF'
          package com.example.shtile

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.widget.Toast
          import androidx.core.app.NotificationCompat

          class RunnerService : Service() {

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channelId = "runner_channel"

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.deleteNotificationChannel(channelId)
                      val chan = NotificationChannel(
                          channelId,
                          "Runner",
                          NotificationManager.IMPORTANCE_MIN
                      ).apply {
                          setShowBadge(false)
                          enableLights(false)
                          enableVibration(false)
                          setSound(null, null)
                      }
                      nm.createNotificationChannel(chan)
                  }

                  val notif: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("")
                      .setContentText("")
                      .setSmallIcon(android.R.drawable.stat_notify_sync_noanim)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setSilent(true)
                      .setOngoing(true)
                      .build()

                  try {
                      startForeground(1, notif)
                  } catch (e: Exception) {}

                  val action = intent?.action
                  Thread {
                      try {
                          val prefs = getSharedPreferences("GucciPrefs", MODE_PRIVATE)
                          val cmd = if (action == "com.example.shtile.RUN_BRUTAL") {
                              val option = prefs.getString("brutal_option", "7") ?: "7"
                              "cd /data/local/tmp && (echo 2; sleep 4; echo $option; sleep 2) | ./Gucci_brutal"
                          } else {
                              val key = prefs.getString("license_key", "")
                              if (key.isNullOrEmpty()) {
                                  Handler(Looper.getMainLooper()).post { Toast.makeText(applicationContext, "Save License Key first!", Toast.LENGTH_LONG).show() }
                                  stopSelf()
                                  return@Thread
                              }
                              "cd /data/local/tmp && (sleep 1; echo '$key') | ./Gucci_core"
                          }
                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true).start()
                          p.inputStream.bufferedReader().readText()
                          p.waitFor()
                      } catch (e: Exception) {}

                      try {
                          stopForeground(true)
                      } catch (e: Exception) {}
                      stopSelf()
                  }.start()

                  return START_NOT_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > app/src/main/java/com/example/shtile/SafeTileService.kt <<'EOF'
          package com.example.shtile

          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class SafeTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Boost"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }
              override fun onClick() {
                  super.onClick()
                  val i = Intent(this, RunnerService::class.java).apply {
                      action = "com.example.shtile.RUN_NORMAL"
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(i)
                  } else {
                      startService(i)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/BrutalTileService.kt <<'EOF'
          package com.example.shtile

          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class BrutalTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Turbo Mode"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }
              override fun onClick() {
                  super.onClick()
                  val i = Intent(this, RunnerService::class.java).apply {
                      action = "com.example.shtile.RUN_BRUTAL"
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(i)
                  } else {
                      startService(i)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/MainActivity.kt <<'EOF'
          package com.example.shtile

          import android.content.Context
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var status: TextView
              private lateinit var keyInput: EditText
              private lateinit var brutalInput: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  status = findViewById(R.id.status)
                  keyInput = findViewById(R.id.keyInput)
                  brutalInput = findViewById(R.id.brutalInput)

                  val prefs = getSharedPreferences("GucciPrefs", Context.MODE_PRIVATE)
                  keyInput.setText(prefs.getString("license_key", ""))
                  brutalInput.setText(prefs.getString("brutal_option", "7"))

                  findViewById<Button>(R.id.saveKeyBtn).setOnClickListener {
                      val key = keyInput.text.toString().trim()
                      val option = brutalInput.text.toString().trim()

                      if (key.isNotEmpty() && option.isNotEmpty()) {
                          prefs.edit().putString("license_key", key).apply()
                          prefs.edit().putString("brutal_option", option).apply()
                          Toast.makeText(this, "Configuration Saved!", Toast.LENGTH_SHORT).show()
                          status.text = "✅ System Configured Successfully"
                      } else {
                          Toast.makeText(this, "Please fill both fields", Toast.LENGTH_SHORT).show()
                      }
                  }

                  status.text = "Status: Waiting for configuration"
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0B0F14</color>
              <color name="bg_card">#151B23</color>
              <color name="accent_green">#00E5A0</color>
              <color name="text_primary">#FFFFFF</color>
              <color name="text_secondary">#9BA3AF</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/bg_btn_save.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ripple xmlns:android="http://schemas.android.com/apk/res/android"
              android:color="#33FFFFFF">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/accent_green"/>
                      <corners android:radius="12dp"/>
                  </shape>
              </item>
          </ripple>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_main"
              android:fillViewport="true">

              <LinearLayout
                  android:orientation="vertical"
                  android:padding="24dp"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content">

                  <!-- Header -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Settings Panel"
                      android:textColor="@color/text_primary"
                      android:textSize="32sp"
                      android:textStyle="bold"
                      android:letterSpacing="0.05"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Background Script Configuration"
                      android:textColor="@color/text_secondary"
                      android:textSize="14sp"
                      android:layout_marginTop="4dp"
                      android:layout_marginBottom="32dp"/>

                  <!-- License Card -->
                  <com.google.android.material.card.MaterialCardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardBackgroundColor="@color/bg_card"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="0dp"
                      app:strokeWidth="1dp"
                      app:strokeColor="#232A35"
                      android:layout_marginBottom="16dp">

                      <LinearLayout
                          android:orientation="vertical"
                          android:padding="20dp"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="LICENSE KEY"
                              android:textColor="@color/accent_green"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:letterSpacing="0.1"
                              android:layout_marginBottom="8dp"/>

                          <EditText
                              android:id="@+id/keyInput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="Enter your key here..."
                              android:inputType="text"
                              android:padding="12dp"
                              android:background="#00000000"
                              android:textColor="@color/text_primary"
                              android:textColorHint="@color/text_secondary"
                              android:textSize="16sp"/>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <!-- Driver Card -->
                  <com.google.android.material.card.MaterialCardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardBackgroundColor="@color/bg_card"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="0dp"
                      app:strokeWidth="1dp"
                      app:strokeColor="#232A35"
                      android:layout_marginBottom="32dp">

                      <LinearLayout
                          android:orientation="vertical"
                          android:padding="20dp"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="BRUTAL DRIVER (1-10)"
                              android:textColor="@color/accent_green"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:letterSpacing="0.1"
                              android:layout_marginBottom="8dp"/>

                          <EditText
                              android:id="@+id/brutalInput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="e.g. 7"
                              android:inputType="number"
                              android:padding="12dp"
                              android:background="#00000000"
                              android:textColor="@color/text_primary"
                              android:textColorHint="@color/text_secondary"
                              android:textSize="16sp"/>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <!-- Save Button -->
                  <Button
                      android:id="@+id/saveKeyBtn"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="SAVE CONFIGURATION"
                      android:textColor="#000000"
                      android:textSize="14sp"
                   
